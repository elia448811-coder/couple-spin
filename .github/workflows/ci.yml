name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck + build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_GATE: 'true'

      - name: Auth mechanism checks
        run: node scripts/test-auth.mjs

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
