name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify copies of the Firestore rules
        run: node scripts/check-firestore-rules-copies.mjs

      - name: Check the source exporter
        run: node scripts/test-source-export.mjs

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck + build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_GATE: 'true'
          VITE_BUILD_VERSION: ${{ github.sha }}

      - name: Bundle size budget
        run: node scripts/check-bundle-budget.mjs

      - name: Auth mechanism checks
        run: node scripts/test-auth.mjs

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Check account and room permissions in the Firestore emulator
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          npx --yes firebase-tools@15.27.0 emulators:exec --only firestore --project demo-couple-spin "node functions/scripts/test-profile-rules.mjs && node functions/scripts/test-rooms.mjs"

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SITE_GATE: 'false'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke e2e
        run: npm run test:e2e
