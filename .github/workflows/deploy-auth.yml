name: Deploy Auth Worker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-auth.yml'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            PASS_W

      - name: Worker URL reminder
        run: |
          echo "Worker deployed. Set GitHub Variable VITE_AUTH_API_URL to:"
          echo "https://couple-spin-auth.<your-subdomain>.workers.dev"
          echo "Then re-run Deploy workflow (or push to main)."
